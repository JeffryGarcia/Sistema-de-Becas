# =============================================================================
# .streamlit/config.toml -> TEMA de Streamlit: SIEMPRE claro (paleta verde oscuro)
# Un solo tema definido: no hay modo oscuro ni selector de tema.
# Streamlit lee este archivo al arrancar. Si lo cambias, reinicia la app.
# Si cambias la paleta en style.css, cambia también estos colores.
#
# IMPORTANTE: la carpeta .streamlit debe estar junto a app.py.
# =============================================================================

[theme]
base = "light"
font = "sans serif"
primaryColor = "#0F6A4D"             # = --acento de style.css
backgroundColor = "#FBFDFC"          # = --tarjeta
secondaryBackgroundColor = "#EDF5F0" # = --superficie
textColor = "#12281F"                # = --texto
baseRadius = "large"